name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Validate OpenAPI contract
        run: npm run openapi:validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: API tests
        run: npm run test:api

      - name: Integration tests
        run: npm run test:integration

      - name: Autopilot tests
        run: npm run test:autopilot

      - name: Internal-alpha evaluations
        run: npm run test:evaluations

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://stroman:stroman@localhost:5432/stroman_os?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact-lock production image
        run: docker build --tag stroman-os:ci .

      - name: Verify non-root runtime and writable mounted data path
        run: >-
          docker run --rm
          --mount type=tmpfs,destination=/app/.data
          stroman-os:ci
          sh -c 'test "$(id -u)" = 1001 && test "$(id -g)" = 1001 && touch /app/.data/ci-write-test && npx prisma --version >/dev/null'

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://stroman:stroman@localhost:5432/stroman_os?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
